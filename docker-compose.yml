services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    ports:
      - "127.0.0.1:8888:8888"   # solo accesible desde tu computador
    environment:
      JUPYTER_TOKEN: 8fd52092439b02a3f81ed4a34db5f288
      # Se toman de tu terminal si las defines (para dvc pull/push)
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - .:/work